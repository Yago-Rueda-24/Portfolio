server {
    listen 80;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Compresión Gzip para mejorar rendimiento
    gzip on;
    gzip_vary on;
    gzip_min_length 10240;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml application/javascript image/svg+xml;
    gzip_disable "MSIE [1-6]\.";

    # Solución para SPA (React Router):
    # Si la ruta solicitada no es un archivo o directorio físico existente, 
    # Nginx sirve index.html y permite que el enrutador del cliente gestione la URL.
    # Esto evita errores 404 al recargar la página en subrutas.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Desactivar caché para index.html para asegurar la carga inmediata de nuevos despliegues
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        expires off;
    }

    # Caching optimizado para recursos estáticos (JS, CSS, imágenes, fuentes)
    location ~* \.(?:css|js|jpg|jpeg|gif|png|ico|cur|gz|svg|svgz|mp4|ogg|ogv|webm|htc|woff|woff2|ttf)$ {
        expires 1y;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Fallback de errores HTTP a index.html
    error_page 404 /index.html;
}
